<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Retrace app icon source. Regenerate: rsvg-convert -w 1024 -h 1024 icons/source.svg -o /tmp/icon.png && pnpm tauri icon /tmp/icon.png -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.22" />
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#141414" filter="url(#shadow)" />
  <!-- An R drawn as a commit graph. Branches in the dark-theme accent, the integration branch in white. -->
  <g fill="none" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <!-- the bowl: a branch that left and merged back -->
    <path d="M380 270 H540 A121 121 0 0 1 540 512 H380" stroke="#8f98ff" />
    <!-- the leg: a branch still in progress -->
    <path d="M380 512 L640 754" stroke="#8f98ff" />
    <!-- the integration branch, pinned left -->
    <path d="M380 270 V754" stroke="#ffffff" />
  </g>
  <g fill="#ffffff">
    <circle cx="380" cy="270" r="50" />
    <circle cx="380" cy="512" r="50" />
    <circle cx="380" cy="754" r="50" />
  </g>
  <circle cx="640" cy="754" r="50" fill="#8f98ff" />
</svg>
